name: Checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start demo with PostgreSQL
        run: docker compose up --build --wait
      - name: Check the application and its API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'Forma AI'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error 'http://127.0.0.1:8080/api/dashboard?days=7'
      - name: Stop demo
        if: always()
        run: docker compose down
